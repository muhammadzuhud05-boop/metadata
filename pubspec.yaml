name: stok_meta
description: Pembuat judul dan keyword stock foto/video dengan AI Gemini.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  file_picker: ^8.1.4
  permission_handler: ^11.3.1
  video_thumbnail: ^0.5.6
  image: ^4.3.0
  path: ^1.9.0
  wakelock_plus: ^1.2.8

flutter:
  uses-material-design: true
