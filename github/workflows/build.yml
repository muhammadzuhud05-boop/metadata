name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.x'
          cache: true

      - name: Siapkan proyek Android
        run: |
          flutter create . --platforms=android --project-name stok_meta --org com.stokmeta
          rm -rf test
          mkdir -p lib
          if [ -f main.dart ]; then mv -f main.dart lib/main.dart; fi
          if [ -f processor.dart ]; then mv -f processor.dart lib/processor.dart; fi
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'MANAGE_EXTERNAL_STORAGE' not in s:
              perms = (
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
                  '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n'
                  '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n'
                  '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n'
              )
              s = s.replace('<application', perms + '    <application', 1)
              s = s.replace('<application', '<application android:requestLegacyExternalStorage="true"', 1)
              s = re.sub(r'android:label="[^"]*"', 'android:label="Stok Meta"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - run: flutter pub get

      - name: Tambal plugin video_thumbnail
        run: |
          python3 - <<'PY'
          import glob, os, re
          for d in glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/video_thumbnail-*/android')):
              g = os.path.join(d, 'build.gradle')
              s = open(g, encoding='utf-8').read()
              s = s.replace('jcenter()', 'mavenCentral()')
              if 'namespace' not in s:
                  m = open(os.path.join(d, 'src/main/AndroidManifest.xml'), encoding='utf-8').read()
                  pkg = re.search(r'package="([^"]+)"', m).group(1)
                  s = re.sub(r'android\s*\{', "android {\n    namespace '" + pkg + "'", s, count=1)
              open(g, 'w', encoding='utf-8').write(s)
              print('Ditambal:', g)
          PY

      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Tanda tangan APK dengan kunci tetap
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          OUT=build/app/outputs/flutter-apk/stok-meta.apk
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "Kunci tetap belum diatur. Memakai tanda tangan sementara."
            cp "$APK" "$OUT"
            exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-key-alias stokmeta \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          rm -f "$RUNNER_TEMP/ks.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: stok-meta-apk
          path: build/app/outputs/flutter-apk/stok-meta.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stok Meta build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/stok-meta.apk
